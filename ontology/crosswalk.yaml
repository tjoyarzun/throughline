# Keyword -> theme crosswalk.
#
# TMDB keywords are a folksonomy of ~8,000 user-contributed terms. This file is
# the curated mapping from that folksonomy onto ontology/themes.yaml.
#
# THE MOST IMPORTANT PROPERTY OF THIS FILE IS WHAT IT OMITS. A keyword census
# over 448 titles found the four largest categories are sentiment, provenance,
# format and setting — none of which are themes. `new york city` is a setting.
# `sequel` is an edge. `anime` is a format. `hilarious` is a mood. They map to
# nothing here, and that is correct, not incomplete.
#
# salience: how strongly the keyword implies the theme. Multiple keywords on one
# title accumulate; the derivation keeps themes above threshold, capped at 6.
#
# decided_by: llm_draft until a human confirms. Rows still marked llm_draft are
# visible in the admin view and reviewed opportunistically. See docs/ontology.md.

version: 1
default_decided_by: llm_draft

# Keywords deliberately mapped to nothing, recorded so the coverage metric can
# distinguish "considered and excluded" from "never looked at".
