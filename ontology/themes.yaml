# Throughline curated theme vocabulary — v1 DRAFT.
#
# STATUS: drafted 2026-09-20, AWAITING EDITORIAL REVIEW (see docs/ontology.md
# #theme-changelog). This is Tommy's editorial position, not a provider's data.
# Budget ~2 hours to review before Phase 2 derives edges at corpus scale.
#
# WHY THIS EXISTS: TMDB "keywords" are a ~40k-term folksonomy mixing settings
# ("new york city"), objects ("robot"), plot devices ("time loop"), and tone
# ("dystopia"). A serious ontology does not adopt a folksonomy wholesale. These
# themes are mapped FROM keywords via core.crosswalk_keyword_theme; most keywords
# map to zero themes, which is correct — a setting is not a theme.
#
# Hierarchy is two levels: cluster -> theme. Deeper nesting has not earned itself.

version: 1
