# Throughline metric definitions.
#
# Metrics are DEFINED here, not written as SQL inside a React component. The
# resolver (src/lib/metrics/) compiles these to parameterized SQL with the
# account filter injected server-side.
#
# DELIBERATE SCOPE LIMIT: the resolver is ~200 lines and supports the six
# transforms below. This is not dbt and must not grow into it. If a metric needs
# something outside this vocabulary, that is a signal to write a dedicated view
# in sem.*, not to extend the resolver. See docs/semantic-layer.md.

version: 1

transforms: [none, share_of_total, rank, bucket, rate, time_series]

metrics:
  genre_distribution:
    label: Genre distribution
    description: Share of watched titles by genre.
    grain: [account_id, concept_id]
    source: sem.user_taste_affinity
    filter: "node_type = 'concept' AND scheme = 'genre'"
    measure: n_titles
    transform: share_of_total
    viz: donut
    phase: 1

  top_directors:
    label: Most-watched directors
    description: Directors ranked by count of watched titles, with the user's mean rating.
    grain: [account_id, person_id]
    source: sem.user_taste_affinity
    filter: "node_type = 'person' AND predicate = 'directed_by'"
    measure: n_titles
    secondary_measure: avg_rating
    transform: rank
    limit: 10
    viz: ranked_list
    phase: 1

  rating_distribution:
    label: Rating distribution
    description: How the user's own ratings are spread across the half-star scale.
    grain: [account_id, rating]
    source: sem.user_title
    filter: "status = 'watched' AND rating IS NOT NULL"
    # Stated explicitly, like every other non-label metric. Without it the
    # resolver falls back to `label`, which sem.user_title does not have.
    dimension: rating
    measure: count_distinct(title_id)
    transform: none
    viz: histogram
    phase: 1

  viewing_over_time:
    label: Viewing over time
    description: Titles finished per month.
    grain: [account_id, month]
    source: sem.user_viewing
    dimension: "date_trunc('month', watched_on)"
    filter: "date_precision <> 'unknown'"
    measure: count(*)
    transform: time_series
    viz: sparkline
    phase: 1

  watchlist_aging:
    label: Watchlist aging
    description: How long things have been sitting unwatched.
    grain: [account_id, bucket]
    source: sem.user_title
    filter: "status = 'watchlist'"
    dimension: 'width_bucket(days_on_watchlist, ARRAY[30,90,180,365])'
    measure: count_distinct(title_id)
    transform: bucket
    viz: bar
    phase: 1

  # --- Phase 2 ---
  theme_distribution:
    label: Theme distribution
    description: Share of watched titles by curated theme. The interesting one — this is our vocabulary, not a provider's.
    grain: [account_id, concept_id]
    source: sem.user_taste_affinity
    filter: "node_type = 'concept' AND scheme = 'theme'"
    measure: n_titles
    transform: share_of_total
    viz: donut
    phase: 2

  franchise_coverage:
    label: Franchise coverage
    description: How much of each franchise the user has seen.
    grain: [account_id, collection_id]
    source: sem.user_franchise_coverage
    measure: watched_count
    secondary_measure: total_count
    transform: rate
    viz: progress_list
    phase: 2

  completion_rate:
    label: Show completion rate
    description: Share of started shows that were finished rather than abandoned.
    grain: [account_id]
    source: sem.user_title
    filter: "kind = 'show' AND status IN ('watched','abandoned')"
    measure: "count(*) FILTER (WHERE status = 'watched')::float / nullif(count(*),0)"
    transform: none
    viz: stat
    phase: 2

  under_watched_genres:
    label: Under-watched genres
    description: >-
      The user's genre distribution compared against the corpus distribution.
      The first genuinely analytical metric rather than a descriptive one.
    grain: [account_id, concept_id]
    source: sem.user_taste_affinity
    compare_to: sem.corpus_genre_distribution
    measure: share_delta
    transform: rank
    ascending: true
    limit: 5
    viz: ranked_list
    phase: 2
